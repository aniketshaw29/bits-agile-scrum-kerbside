<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Sprint 1 burn-down chart: ideal remaining effort versus actual remaining effort over 10 working days, both ending at zero on day 10.">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="70" y="28" font-size="17" font-weight="600" fill="#191919">Sprint 1 Burn-down — Kerbside</text>
  <text x="70" y="48" font-size="12.5" fill="#666666">Remaining effort (task-hours) across a 10-day sprint · committed 40h = 8 story points (T1 + T2)</text>

  <!-- Gridlines (horizontal) + Y ticks: 0,8,16,24,32,40 hours -->
  <g stroke="#e7e7e7" stroke-width="1">
    <line x1="70" y1="360" x2="680" y2="360"/>
    <line x1="70" y1="296" x2="680" y2="296"/>
    <line x1="70" y1="232" x2="680" y2="232"/>
    <line x1="70" y1="168" x2="680" y2="168"/>
    <line x1="70" y1="104" x2="680" y2="104"/>
    <line x1="70" y1="40"  x2="680" y2="40"/>
  </g>
  <g font-size="11" fill="#666666" text-anchor="end">
    <text x="60" y="364">0</text>
    <text x="60" y="300">8</text>
    <text x="60" y="236">16</text>
    <text x="60" y="172">24</text>
    <text x="60" y="108">32</text>
    <text x="60" y="44">40</text>
  </g>
  <text x="22" y="200" font-size="12" fill="#666666" transform="rotate(-90 22 200)" text-anchor="middle">Remaining effort (hours)</text>

  <!-- Axes -->
  <line x1="70" y1="40" x2="70" y2="360" stroke="#c2c2c2" stroke-width="1.5"/>
  <line x1="70" y1="360" x2="680" y2="360" stroke="#c2c2c2" stroke-width="1.5"/>

  <!-- X ticks: days 0..10 -->
  <g font-size="11" fill="#666666" text-anchor="middle">
    <text x="70"  y="378">0</text>
    <text x="131" y="378">1</text>
    <text x="192" y="378">2</text>
    <text x="253" y="378">3</text>
    <text x="314" y="378">4</text>
    <text x="375" y="378">5</text>
    <text x="436" y="378">6</text>
    <text x="497" y="378">7</text>
    <text x="558" y="378">8</text>
    <text x="619" y="378">9</text>
    <text x="680" y="378">10</text>
  </g>
  <text x="375" y="400" font-size="12" fill="#666666" text-anchor="middle">Working day</text>

  <!-- Ideal line (gray, dashed reference guide) -->
  <line x1="70" y1="40" x2="680" y2="360" stroke="#666666" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Actual line (series blue) -->
  <polyline fill="none" stroke="#257de0" stroke-width="2" stroke-linejoin="round"
    points="70,40 131,56 192,80 253,112 314,136 375,168 436,192 497,232 558,272 619,320 680,360"/>
  <g fill="#257de0">
    <circle cx="70"  cy="40"  r="4"/>
    <circle cx="131" cy="56"  r="4"/>
    <circle cx="192" cy="80"  r="4"/>
    <circle cx="253" cy="112" r="4"/>
    <circle cx="314" cy="136" r="4"/>
    <circle cx="375" cy="168" r="4"/>
    <circle cx="436" cy="192" r="4"/>
    <circle cx="497" cy="232" r="4"/>
    <circle cx="558" cy="272" r="4"/>
    <circle cx="619" cy="320" r="4"/>
    <circle cx="680" cy="360" r="4"/>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#191919">
    <line x1="470" y1="66" x2="500" y2="66" stroke="#257de0" stroke-width="2"/>
    <circle cx="485" cy="66" r="4" fill="#257de0"/>
    <text x="508" y="70">Actual</text>
    <line x1="560" y1="66" x2="590" y2="66" stroke="#666666" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="598" y="70">Ideal</text>
  </g>
</svg>
